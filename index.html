<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anime Night</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#05030d;
}

/* =========================
   MAIN SCENE
========================= */

.scene{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
        radial-gradient(circle at 50% 25%,
        #413070 0%,
        #17132f 35%,
        #080817 70%,
        #020208 100%);
}

/* =========================
   MOON
========================= */

.moon{
    position:absolute;

    width:180px;
    height:180px;

    right:12%;
    top:10%;

    border-radius:50%;

    background:
        radial-gradient(circle at 35% 30%,
        #ffffff,
        #ddd9ff 45%,
        #a89de0 75%,
        #6d5ca8);

    box-shadow:
        0 0 30px #b9a9ff,
        0 0 80px rgba(154,130,255,.45);

    animation:moonFloat 5s ease-in-out infinite;
}

@keyframes moonFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }
}

/* Moon craters */

.moon::before,
.moon::after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:rgba(100,85,150,.18);
}

.moon::before{
    width:35px;
    height:35px;
    left:35px;
    top:45px;
}

.moon::after{
    width:22px;
    height:22px;
    right:35px;
    bottom:40px;
}

/* =========================
   STARS
========================= */

.stars{
    position:absolute;
    inset:0;
}

.star{
    position:absolute;
    width:3px;
    height:3px;

    background:white;
    border-radius:50%;

    box-shadow:0 0 10px white;

    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.2;
        transform:scale(.6);
    }

    to{
        opacity:1;
        transform:scale(1.5);
    }
}

.star:nth-child(1){left:8%;top:15%;animation-delay:.2s}
.star:nth-child(2){left:18%;top:30%;animation-delay:1s}
.star:nth-child(3){left:27%;top:12%;animation-delay:.5s}
.star:nth-child(4){left:38%;top:22%;animation-delay:1.4s}
.star:nth-child(5){left:49%;top:8%;animation-delay:.8s}
.star:nth-child(6){left:62%;top:18%;animation-delay:1.7s}
.star:nth-child(7){left:74%;top:7%;animation-delay:.4s}
.star:nth-child(8){left:84%;top:28%;animation-delay:1.2s}
.star:nth-child(9){left:94%;top:15%;animation-delay:.9s}
.star:nth-child(10){left:70%;top:40%;animation-delay:1.5s}
.star:nth-child(11){left:12%;top:45%;animation-delay:.6s}
.star:nth-child(12){left:45%;top:38%;animation-delay:1.1s}

/* =========================
   CITY SILHOUETTE
========================= */

.city{
    position:absolute;
    bottom:0;
    width:100%;
    height:32%;

    background:#05040c;
    clip-path:polygon(
        0 60%,
        5% 50%,
        9% 65%,
        14% 38%,
        18% 60%,
        23% 45%,
        27% 62%,
        33% 30%,
        38% 60%,
        44% 42%,
        49% 58%,
        55% 35%,
        60% 60%,
        67% 45%,
        73% 65%,
        79% 32%,
        84% 60%,
        90% 42%,
        95% 55%,
        100% 40%,
        100% 100%,
        0 100%
    );
}

/* =========================
   CHARACTER
========================= */

.character{
    position:absolute;

    left:50%;
    bottom:-20px;

    width:380px;
    height:650px;

    transform:translateX(-50%);

    animation:characterFloat 4s ease-in-out infinite;

    filter:drop-shadow(0 20px 30px rgba(0,0,0,.8));
}

@keyframes characterFloat{
    0%,100%{
        transform:translateX(-50%) translateY(0);
    }

    50%{
        transform:translateX(-50%) translateY(-10px);
    }
}

/* Hair */

.hair{
    position:absolute;

    width:245px;
    height:290px;

    left:67px;
    top:70px;

    background:
        linear-gradient(
            135deg,
            #171525,
            #332457 50%,
            #100e1c
        );

    border-radius:
        48% 52% 45% 45% /
        40% 42% 58% 60%;

    box-shadow:
        inset -20px -15px 30px rgba(0,0,0,.45);

    z-index:2;

    animation:hairMove 3s ease-in-out infinite;
}

@keyframes hairMove{
    0%,100%{
        transform:rotate(0deg);
    }

    50%{
        transform:rotate(-2deg);
    }
}

/* Hair spikes */

.hair:before{
    content:"";

    position:absolute;

    left:-35px;
    top:70px;

    width:100px;
    height:130px;

    background:#211738;

    clip-path:polygon(
        100% 0,
        40% 25%,
        0 50%,
        45% 55%,
        10% 100%,
        100% 80%
    );
}

.hair:after{
    content:"";

    position:absolute;

    right:-40px;
    top:55px;

    width:110px;
    height:150px;

    background:#211738;

    clip-path:polygon(
        0 0,
        65% 20%,
        100% 50%,
        65% 60%,
        100% 100%,
        0 80%
    );
}

/* Face */

.face{
    position:absolute;

    width:180px;
    height:210px;

    left:100px;
    top:125px;

    background:
        linear-gradient(135deg,#ffe9df,#eec7c5);

    border-radius:
        48% 48% 45% 45% /
        42% 42% 58% 58%;

    z-index:3;

    box-shadow:
        inset -10px -15px 20px rgba(120,60,80,.15);
}

/* Face hair bangs */

.bang{
    position:absolute;

    z-index:5;

    width:110px;
    height:100px;

    left:135px;
    top:100px;

    background:#29203f;

    clip-path:polygon(
        0 0,
        100% 0,
        78% 90%,
        60% 55%,
        45% 100%,
        25% 55%,
        8% 85%
    );
}

/* Eyes */

.eye{
    position:absolute;

    width:55px;
    height:35px;

    top:205px;

    background:white;

    border:4px solid #291b40;

    border-radius:50%;

    z-index:7;

    overflow:hidden;

    animation:blink 5s infinite;
}

.eye.left{
    left:118px;
}

.eye.right{
    left:207px;
}

@keyframes blink{
    0%,46%,50%,100%{
        transform:scaleY(1);
    }

    48%{
        transform:scaleY(.08);
    }
}

/* Iris */

.eye::before{
    content:"";

    position:absolute;

    width:22px;
    height:28px;

    left:13px;
    top:2px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 50% 35%,
            white 0 15%,
            #55d8ff 16% 45%,
            #5147d9 46% 75%,
            #17102e 76%
        );

    box-shadow:0 0 12px #62dfff;
}

/* Nose */

.nose{
    position:absolute;

    width:12px;
    height:22px;

    left:184px;
    top:244px;

    border-right:2px solid rgba(130,70,80,.5);

    transform:rotate(12deg);

    z-index:7;
}

/* Mouth */

.mouth{
    position:absolute;

    left:170px;
    top:280px;

    width:35px;
    height:12px;

    border-bottom:3px solid #a65b72;

    border-radius:50%;

    z-index:7;
}

/* Neck */

.neck{
    position:absolute;

    width:65px;
    height:90px;

    left:158px;
    top:310px;

    background:#e9bdb9;

    z-index:1;
}

/* Clothes */

.body{
    position:absolute;

    left:78px;
    top:345px;

    width:225px;
    height:310px;

    background:
        linear-gradient(
            135deg,
            #11121f,
            #30225a,
            #11101b
        );

    clip-path:polygon(
        25% 0,
        75% 0,
        100% 100%,
        0 100%
    );

    z-index:4;

    box-shadow:
        inset 0 0 30px rgba(120,80,255,.25);
}

/* Jacket line */

.body:before{
    content:"";

    position:absolute;

    width:5px;
    height:100%;

    left:50%;

    background:#a77cff;

    box-shadow:0 0 15px #9b72ff;
}

/* Scarf */

.scarf{
    position:absolute;

    width:210px;
    height:45px;

    left:85px;
    top:335px;

    background:
        linear-gradient(90deg,#5b2d89,#d86cff,#51267e);

    border-radius:20px;

    z-index:5;

    box-shadow:0 0 20px rgba(190,90,255,.4);

    animation:scarfWave 2s ease-in-out infinite;
}

@keyframes scarfWave{
    0%,100%{
        transform:rotate(0deg);
    }

    50%{
        transform:rotate(3deg) translateX(8px);
    }
}

/* =========================
   SWORD
========================= */

.sword{
    position:absolute;

    right:12%;

    bottom:17%;

    width:18px;
    height:300px;

    background:
        linear-gradient(
            90deg,
            #777,
            white,
            #777
        );

    transform:rotate(25deg);

    border-radius:10px;

    box-shadow:0 0 20px rgba(180,220,255,.7);

    animation:swordGlow 2s infinite alternate;
}

.sword:after{
    content:"";

    position:absolute;

    bottom:-25px;
    left:-20px;

    width:58px;
    height:20px;

    border-radius:50%;

    background:#d49c48;

    box-shadow:0 0 10px #d49c48;
}

@keyframes swordGlow{
    from{
        filter:brightness(.8);
    }

    to{
        filter:brightness(1.5);
    }
}

/* =========================
   SAKURA PETALS
========================= */

.petals{
    position:absolute;
    inset:0;

    pointer-events:none;

    z-index:10;
}

.petal{
    position:absolute;

    width:12px;
    height:8px;

    background:#ff9fca;

    border-radius:70% 20% 70% 20%;

    box-shadow:0 0 8px rgba(255,130,200,.7);

    animation:fall linear infinite;
}

@keyframes fall{
    0%{
        transform:
            translate3d(0,-10vh,0)
            rotate(0deg);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    50%{
        transform:
            translate3d(100px,50vh,0)
            rotate(180deg);
    }

    100%{
        transform:
            translate3d(-100px,110vh,0)
            rotate(360deg);
        opacity:0;
    }
}

.petal:nth-child(1){left:5%;animation-duration:7s}
.petal:nth-child(2){left:15%;animation-duration:9s;animation-delay:1s}
.petal:nth-child(3){left:28%;animation-duration:6s;animation-delay:2s}
.petal:nth-child(4){left:40%;animation-duration:8s;animation-delay:.5s}
.petal:nth-child(5){left:55%;animation-duration:10s;animation-delay:3s}
.petal:nth-child(6){left:68%;animation-duration:7s;animation-delay:1.5s}
.petal:nth-child(7){left:80%;animation-duration:9s;animation-delay:2.5s}
.petal:nth-child(8){left:92%;animation-duration:6s;animation-delay:1s}

/* =========================
   UI
========================= */

.info{
    position:absolute;

    left:35px;
    top:35px;

    z-index:20;

    padding:12px 18px;

    border:1px solid rgba(255,255,255,.2);

    border-radius:12px;

    background:rgba(0,0,0,.25);

    backdrop-filter:blur(12px);

    color:#eee;

    letter-spacing:3px;

    font-size:12px;

    animation:fadeIn 2s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(-15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

    .moon{
        width:120px;
        height:120px;

        right:8%;
        top:8%;
    }

    .character{
        transform:translateX(-50%) scale(.72);
        transform-origin:bottom center;
    }

    @keyframes characterFloat{
        0%,100%{
            transform:translateX(-50%) scale(.72) translateY(0);
        }

        50%{
            transform:translateX(-50%) scale(.72) translateY(-10px);
        }
    }

    .sword{
        right:4%;
        bottom:12%;
        transform:rotate(25deg) scale(.7);
    }

    .info{
        left:15px;
        top:15px;
        font-size:9px;
    }
}
</style>
</head>

<body>

<div class="scene">

    <!-- Moon -->
    <div class="moon"></div>

    <!-- Stars -->
    <div class="stars">
        <i class="star"></i>
        <i class="star"></i>
        <i class="star"></i>
        <i class="star"></i>
        <i class="star"></i>
        <i class="star"></i>
        <i class="star"></i>
        <i class="star"></i>
        <i class="star"></i>
        <i class="star"></i>
        <i class="star"></i>
        <i class="star"></i>
    </div>

    <!-- City -->
    <div class="city"></div>

    <!-- Anime Character -->
    <div class="character">

        <div class="hair"></div>

        <div class="face"></div>

        <div class="bang"></div>

        <div class="eye left"></div>
        <div class="eye right"></div>

        <div class="nose"></div>
        <div class="mouth"></div>

        <div class="neck"></div>

        <div class="body"></div>

        <div class="scarf"></div>

    </div>

    <!-- Sword -->
    <div class="sword"></div>

    <!-- Falling Sakura -->
    <div class="petals">
        <i class="petal"></i>
        <i class="petal"></i>
        <i class="petal"></i>
        <i class="petal"></i>
        <i class="petal"></i>
        <i class="petal"></i>
        <i class="petal"></i>
        <i class="petal"></i>
    </div>

    <div class="info">
        NIGHT • WARRIOR
    </div>

</div>

</body>
</html>
