```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Image</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 350px;
      background: white;
      padding: 15px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 15px;
    }

    h1 {
      margin: 15px 0;
      color: #222;
    }

    .btn {
      padding: 12px 25px;
      border: 2px solid #222;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.2s;
    }

    .btn:hover {
      background: #222;
      color: white;
    }

    .btn:active {
      transform: scale(0.94);
    }
  </style>
</head>

<body>

  <div class="card">
    <img
      src="https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?auto=format&fit=crop&w=800&q=80"
      alt="Animal Image"
    >

    <h1>Lion 🦁</h1>

    <button class="btn" onclick="showMessage()">
      Click Me
    </button>
  </div>

  <script>
    function showMessage() {
      alert("You clicked the animal button! 🦁");
    }
  </script>

</body>
</html>
```
