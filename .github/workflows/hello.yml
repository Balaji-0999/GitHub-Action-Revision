name: CICD

on:
  push:
    branches: [main]
  paths: 
    - "**.html"
  


jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Code 
        run: echo "code building"
    
  build:
    needs: code
    runs-on: ubuntu-latest
    steps:
      - name: Building code
        run: echo "code built"
      
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Test code
        run: echo "code tasted"
        
  doploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: echo "congratulation your app has been deployed"
    
  
