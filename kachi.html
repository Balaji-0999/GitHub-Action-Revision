<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Prakriti se Brahmand tak</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--bar:rgba(8,10,20,.74);--ink:#fff;--acc:#ff3b4e}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#05060d;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
nav{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:var(--bar);border-radius:999px;backdrop-filter:blur(8px);max-width:calc(100% - 16px);overflow-x:auto;z-index:2;scrollbar-width:none}
nav button{border:0;background:transparent;color:#cfd6ee;font:600 13px system-ui;padding:8px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button:hover{background:rgba(255,255,255,.12)}
nav button:focus-visible{outline:2px solid #fff}
nav button[aria-current=true]{background:#fff;color:#0a0d1c}
#cap{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);z-index:2;text-shadow:0 2px 8px #000;pointer-events:none}
#ct{display:block;font:32px Bangers,Impact,sans-serif;letter-spacing:1px}
#cs{font-size:14px;opacity:.85}
</style></head><body>
<canvas id="c"></canvas>
<nav id="nav" aria-label="Scenes"></nav>
<div id="cap"><b id="ct"></b><span id="cs"></span></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
let W,H,cur=0,dragX=0,dragY=.9,mx=.5,my=.4,drag=false;
const TS=matchMedia('(prefers-reduced-motion:reduce)').matches?.3:1,TAU=Math.PI*2;
const R=(a,b)=>a+Math.random()*(b-a);
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
const stars=Array.from({length:320},()=>({x:Math.random(),y:Math.random(),s:R(.5,1.7),p:R(0,6)}));
function starfield(t,ym=1){x.fillStyle='#fff';for(const s of stars){x.globalAlpha=.35+.65*Math.abs(Math.sin(t/900+s.p));x.fillRect(s.x*W,s.y*H*ym,s.s,s.s)}x.globalAlpha=1}
function ridge(col,base,amp,f,o,t=0){x.fillStyle=col;x.beginPath();x.moveTo(0,H);for(let i=0;i<=W+8;i+=8){const y=base*H-(Math.sin(i*f+o)*.6+Math.sin(i*f*2.3+o*2)*.4+1)*amp*H;x.lineTo(i,y)}x.lineTo(W,H);x.fill()}
function bird(px,py,s,t,d){x.save();x.translate(px,py);x.scale(d,1);const f=Math.sin(t/140);x.strokeStyle='#120818';x.lineWidth=Math.max(1.5,s/5);x.lineCap='round';x.beginPath();x.moveTo(-s*1.6,-f*s*.9);x.quadraticCurveTo(-s*.8,-s*.7-f*s*.4,0,0);x.quadraticCurveTo(s*.8,-s*.7-f*s*.4,s*1.6,-f*s*.9);x.stroke();x.fillStyle='#120818';x.beginPath();x.arc(0,0,s*.2,0,TAU);x.fill();x.restore()}

/* 1 NATURE */
const cl=Array.from({length:7},()=>({x:Math.random(),y:R(.05,.28),s:R(.6,1.4)}));
function nature(t){
 let g=x.createLinearGradient(0,0,0,H*.7);g.addColorStop(0,'#4fb8ff');g.addColorStop(1,'#ffeab8');x.fillStyle=g;x.fillRect(0,0,W,H);
 const sx=W*.76,sy=H*.22;g=x.createRadialGradient(sx,sy,8,sx,sy,H*.4);g.addColorStop(0,'#fffde8');g.addColorStop(.15,'rgba(255,240,150,.7)');g.addColorStop(1,'rgba(255,240,150,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle='rgba(255,255,255,.9)';for(const c of cl){const px=((c.x+t*.000012*c.s)%1.3-.15)*W,py=c.y*H,r=28*c.s;for(const [dx,dy,k] of [[0,0,1],[r*.9,-r*.3,1.2],[r*1.9,0,.9],[r*.9,r*.25,1.3]]){x.beginPath();x.arc(px+dx,py+dy,r*k*.75,0,TAU);x.fill()}}
 ridge('#7f9ec9',.62,.16,.004,1);ridge('#5b7d9c',.68,.12,.006,4);
 g=x.createLinearGradient(0,H*.66,0,H);g.addColorStop(0,'#5cc0e6');g.addColorStop(1,'#1a6a9a');x.fillStyle=g;x.fillRect(0,H*.7,W,H*.3);
 x.strokeStyle='rgba(255,255,220,.55)';x.lineWidth=2;for(let i=0;i<22;i++){const y=H*.71+i*H*.011,w=(30+i*7)*(1+Math.sin(t/500+i)*.25);x.beginPath();x.moveTo(sx-w,y);x.lineTo(sx+w,y);x.stroke()}
 ridge('#2f8a3c',.86,.06,.005,2);ridge('#1f6a2e',.93,.04,.008,7);
 for(let i=0;i<18;i++){const tx=(i+.5)/18*W,ty=H*(.86+.03*Math.sin(i*2.1)),h=(50+(i%4)*14)*Math.min(1.3,H/600),sw=Math.sin(t/700+i)*4;x.fillStyle='#4a2c17';x.fillRect(tx-3,ty-6,6,14);x.fillStyle=i%2?'#175a2a':'#1d7033';for(let k=0;k<3;k++){const w=h*.32*(1+k*.45),yy=ty-h+k*h*.32;x.beginPath();x.moveTo(tx+sw*(1-k/3),yy-h*.3);x.lineTo(tx-w+sw*.3,yy+h*.34);x.lineTo(tx+w+sw*.3,yy+h*.34);x.fill()}}
 for(let i=0;i<30;i++){const px=(i*97%100)/100*W+Math.sin(t/900+i)*14,py=H*(.7+.3*((i*53)%100)/100)+Math.cos(t/700+i)*8;x.fillStyle=`rgba(255,240,140,${.4+.5*Math.sin(t/300+i)})`;x.beginPath();x.arc(px,py,2,0,TAU);x.fill()}
 for(let i=0;i<4;i++)bird(((t*.04+i*260)%(W+120))-60,H*(.14+i*.05)+Math.sin(t/400+i)*6,7,t+i*90,1)}

/* 2 GALAXY 3D */
const gal=Array.from({length:3400},(_,i)=>{const core=i>2800,r=core?Math.pow(Math.random(),2)*.22:Math.pow(Math.random(),.65),a=core?R(0,TAU):(i%3)*2.094+r*6.5+R(-.35,.35)*(.3+r);return{r,a,y:R(-1,1)*(core?.1:.05*(1-r)+.01),s:R(.6,2),c:core?0:r}});
function proj(r,a,y,R0,rot){const ang=a+rot,px=Math.cos(ang)*r*R0,pz=Math.sin(ang)*r*R0,py=y*R0*2.2,ct=Math.cos(dragY),st=Math.sin(dragY),ry=py*ct-pz*st,rz=py*st+pz*ct,sc=700/(700+rz);return[W/2+px*sc,H/2+ry*sc,sc]}
function galaxy(t){
 let g=x.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'#160a30');g.addColorStop(1,'#000');x.fillStyle=g;x.fillRect(0,0,W,H);starfield(t);
 const R0=Math.min(W,H)*.46,rot=t/9000+dragX;x.globalCompositeOperation='lighter';
 for(const p of gal){const [sx,sy,sc]=proj(p.r,p.a,p.y,R0,rot);x.fillStyle=`hsla(${40+p.c*190},90%,${p.c<.25?78:64}%,${.6*sc})`;x.fillRect(sx,sy,p.s*sc,p.s*sc)}
 g=x.createRadialGradient(W/2,H/2,0,W/2,H/2,R0*.32);g.addColorStop(0,'rgba(255,225,160,.55)');g.addColorStop(1,'rgba(255,200,120,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.globalCompositeOperation='source-over';
 const [mx2,my2]=proj(.62,2.094+.62*6.5,0,R0,rot);x.strokeStyle='#7dffb0';x.lineWidth=2;x.beginPath();x.arc(mx2,my2,9,0,TAU);x.stroke();x.fillStyle='#7dffb0';x.font='600 13px system-ui';x.fillText('Hum yahan hain (Sun)',mx2+14,my2+4)}

/* 3 SEA */
const bub=Array.from({length:50},()=>({x:Math.random(),y:Math.random(),r:R(1.5,5),v:R(.02,.06)}));
function shark(px,py,s,d,c1,c2,t,spots){x.save();x.translate(px,py);x.scale(d*s,s);const w=Math.sin(t/260)*14;
 const body=()=>{x.beginPath();x.moveTo(100,4);x.quadraticCurveTo(50,-30,-20,-24);x.lineTo(-62,-8);x.lineTo(-96,-34+w);x.lineTo(-86,0);x.lineTo(-98,32-w);x.lineTo(-62,8);x.quadraticCurveTo(10,30,100,4)};
 const g=x.createLinearGradient(0,-30,0,30);g.addColorStop(0,c1);g.addColorStop(.55,c1);g.addColorStop(.62,c2);g.addColorStop(1,c2);
 x.fillStyle=c1;x.beginPath();x.moveTo(8,-26);x.lineTo(-16,-62);x.lineTo(-32,-22);x.fill();x.beginPath();x.moveTo(30,10);x.lineTo(-4,46);x.lineTo(-14,14);x.fill();
 body();x.fillStyle=g;x.fill();
 if(spots){x.save();body();x.clip();x.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<40;i++){x.beginPath();x.arc(-70+(i%10)*17,-20+Math.floor(i/10)*10+(i%2)*4,2.2,0,TAU);x.fill()}x.restore()}
 else{x.fillStyle='#fff';for(let k=0;k<5;k++){x.beginPath();x.moveTo(94-k*7,4);x.lineTo(91-k*7,11);x.lineTo(88-k*7,5);x.fill()}}
 x.fillStyle='#000';x.beginPath();x.arc(70,-6,3,0,TAU);x.fill();x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=1.5;for(let k=0;k<3;k++){x.beginPath();x.moveTo(40-k*7,-12);x.lineTo(38-k*7,4);x.stroke()}x.restore()}
function lab(s,px,py,col){x.font='600 14px system-ui';x.fillStyle=col;x.shadowColor='#000';x.shadowBlur=6;x.fillText(s,Math.max(8,Math.min(W-230,px)),py);x.shadowBlur=0}
function sea(t){
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a8fc4');g.addColorStop(.5,'#06426b');g.addColorStop(1,'#020c18');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle='rgba(180,240,255,.07)';for(let i=0;i<5;i++){const b=W*(.1+i*.2)+Math.sin(t/3000+i)*40;x.beginPath();x.moveTo(b-30,0);x.lineTo(b+30,0);x.lineTo(b+160,H);x.lineTo(b-100,H);x.fill()}
 x.fillStyle='#0a1a24';x.beginPath();x.moveTo(0,H);for(let i=0;i<=W;i+=10)x.lineTo(i,H*.9+Math.sin(i*.01)*12);x.lineTo(W,H);x.fill();
 x.strokeStyle='#1f8a55';x.lineWidth=4;for(let i=0;i<W/40;i++){x.beginPath();x.moveTo(i*40,H*.93);x.quadraticCurveTo(i*40+Math.sin(t/700+i)*18,H*.86,i*40+Math.sin(t/700+i+1)*10,H*.8-(i%3)*15);x.stroke()}
 x.fillStyle='rgba(220,250,255,.35)';for(const b of bub){const y=((b.y-t*b.v*.0004)%1+1)%1;x.beginPath();x.arc(b.x*W+Math.sin(t/500+b.y*9)*6,y*H,b.r,0,TAU);x.fill()}
 const ws=Math.min(2.2,W/280),wx=((t*.025)%(W+900))-450,wy=H*.36+Math.sin(t/1500)*14;
 shark(wx,wy,ws,1,'#3d5f7a','#dfe9ee',t,true);lab('Whale Shark: sabse bada machhli (~12 m), harmless',wx-100,wy+ws*70,'#8fffe0');
 const gx=W+300-((t*.06)%(W+700)),gy=H*.66+Math.sin(t/700)*18;
 for(let i=0;i<14;i++){const fx=W+500-((t*.05+i*30)%(W+900))+Math.sin(t/200+i)*10,fy=H*.5+Math.sin(i*2.3+t/900)*40+(i%4)*14;x.save();x.translate(fx,fy);x.scale(-1,1);x.fillStyle='#d9483a';x.beginPath();x.ellipse(0,0,14,8,0,0,TAU);x.fill();x.beginPath();x.moveTo(-10,0);x.lineTo(-22,-8);x.lineTo(-22,8);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(8,-2,2,0,TAU);x.fill();x.restore()}
 lab('Piranha school: khatarnaak jhund',W*.55+Math.sin(t/900)*40,H*.5-40,'#ff9a8a');
 shark(gx,gy,Math.min(1.1,W/420),-1,'#6d7d8c','#f1f4f6',t,false);lab('Great White Shark: dangerous shikari',gx-80,gy+70,'#ff8a8a');
 for(let i=0;i<3;i++){const jx=W*(.18+i*.32),jy=H*.16+Math.sin(t/900+i*2)*22+i*20,p=1+Math.sin(t/500+i)*.12;x.shadowColor='#ff7ad9';x.shadowBlur=18;x.fillStyle='rgba(255,130,210,.4)';x.beginPath();x.ellipse(jx,jy,34*p,26/p,0,Math.PI,0);x.fill();x.shadowBlur=0;x.strokeStyle='rgba(255,160,225,.55)';x.lineWidth=2;for(let k=0;k<7;k++){x.beginPath();x.moveTo(jx-30+k*10,jy);for(let j=1;j<9;j++)x.lineTo(jx-30+k*10+Math.sin(t/300+j+k)*5,jy+j*10);x.stroke()}}
 lab('Box Jellyfish: duniya ke sabse zehreele',W*.16,H*.1,'#ffa8e8')}

/* 4 CITY */
const B1=Array.from({length:26},(_,i)=>({x:i/25,w:R(.03,.06),h:R(.18,.38)})),B2=Array.from({length:14},(_,i)=>({x:i/13+R(-.015,.015),w:R(.045,.075),h:R(.3,.6),tp:i%3}));
function bld(bx,bw,bh,gy,i,t,col){x.fillStyle=col;x.fillRect(bx,gy-bh,bw,bh);const cols=Math.max(2,Math.floor(bw/12)),rows=Math.floor(bh/16);for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const h=(r*31+c*17+i*13+Math.floor(t/2500+r*.3))%5;if(h<2){x.fillStyle=h?'#8fd8ff':'#ffd66b';x.fillRect(bx+5+c*12,gy-bh+8+r*16,6,9)}}}
function city(t){
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0620');g.addColorStop(.6,'#4a1a5c');g.addColorStop(1,'#ff8a5c');x.fillStyle=g;x.fillRect(0,0,W,H);starfield(t,.5);
 g=x.createRadialGradient(W*.8,H*.2,4,W*.8,H*.2,90);g.addColorStop(0,'#fff6d8');g.addColorStop(.3,'rgba(255,246,216,.4)');g.addColorStop(1,'rgba(255,246,216,0)');x.fillStyle=g;x.fillRect(W*.8-100,H*.2-100,200,200);
 const gy=H*.88;x.fillStyle='rgba(255,255,255,.08)';for(let i=0;i<2;i++){const bx=W*(.25+i*.5),a=Math.sin(t/2000+i*3)*W*.3;x.beginPath();x.moveTo(bx-10,gy);x.lineTo(bx+a-60,0);x.lineTo(bx+a+60,0);x.lineTo(bx+10,gy);x.fill()}
 B1.forEach((b,i)=>{x.fillStyle='#1c1440';x.fillRect(b.x*W,gy-b.h*H,b.w*W,b.h*H);x.fillStyle='rgba(120,100,200,.5)';for(let k=0;k<b.h*H/22;k++)x.fillRect(b.x*W+6+(k*7%3)*10,gy-b.h*H+8+k*22,4,6)});
 const tw=Math.max(44,W*.06),th=H*.68,tx=W/2-tw/2;x.fillStyle='#0d0a22';x.beginPath();x.moveTo(tx,gy);x.lineTo(tx+tw*.1,gy-th);x.lineTo(tx+tw*.9,gy-th);x.lineTo(tx+tw,gy);x.fill();x.beginPath();x.moveTo(tx+tw*.1,gy-th);x.lineTo(tx+tw/2,gy-th-H*.16);x.lineTo(tx+tw*.9,gy-th);x.fill();
 for(let r=0;r<th/16;r++)for(let c=0;c<Math.floor(tw*.8/12);c++){const h=(r*29+c*11+Math.floor(t/2200+r*.2))%5;if(h<2){x.fillStyle=h?'#8fd8ff':'#ffd66b';x.fillRect(tx+tw*.1+3+c*12,gy-th+8+r*16,6,9)}}
 const bl=.5+.5*Math.sin(t/300);x.fillStyle=`rgba(255,40,40,${bl})`;x.shadowColor='#f22';x.shadowBlur=14;x.beginPath();x.arc(W/2,gy-th-H*.16,4,0,TAU);x.fill();x.shadowBlur=0;
 B2.forEach((b,i)=>{const bx=b.x*W,bw=Math.max(34,b.w*W),bh=b.h*H;if(Math.abs(bx+bw/2-W/2)<tw)return;bld(bx,bw,bh,gy,i,t,'#0d0a20');x.fillStyle='#0d0a20';if(b.tp===1){x.beginPath();x.moveTo(bx+bw*.4,gy-bh);x.lineTo(bx+bw/2,gy-bh-40);x.lineTo(bx+bw*.6,gy-bh);x.fill()}if(b.tp===2)x.fillRect(bx+bw*.2,gy-bh-24,bw*.6,24);x.fillStyle=`rgba(255,40,40,${.3+.7*Math.abs(Math.sin(t/400+i))})`;x.fillRect(bx+bw/2-2,gy-bh-(b.tp===1?42:b.tp===2?28:6),4,4)});
 x.fillStyle='#07050f';x.fillRect(0,gy,W,H-gy);
 for(let i=0;i<10;i++){const dir=i%2?1:-1,cx=(((t*.09*dir+i*W/10)%(W+60))+W+60)%(W+60)-30,cy=gy+16+(i%2)*22;x.shadowBlur=12;x.shadowColor=dir>0?'#fff2b0':'#f33';x.fillStyle=dir>0?'#fff2b0':'#ff3030';x.fillRect(cx,cy,14,5);x.shadowBlur=0}}

/* 5 BLACK HOLE */
const disk=Array.from({length:2400},()=>({r:1.5+Math.pow(Math.random(),1.6)*4.5,a:R(0,TAU),s:R(.7,2.1)}));
function hole(t){
 x.fillStyle='#000';x.fillRect(0,0,W,H);starfield(t);const cx=W/2,cy=H*.52,Rh=Math.min(W,H)*.085;
 let g=x.createRadialGradient(cx,cy,Rh,cx,cy,Rh*7);g.addColorStop(0,'rgba(255,140,40,.28)');g.addColorStop(1,'rgba(255,140,40,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 const pos=p=>{const a=p.a+t*.0025/Math.pow(p.r,1.5);return[Math.cos(a),Math.sin(a)]};
 const col=(p,c)=>`hsla(${52-(p.r-1.5)*9},100%,${86-(p.r-1.5)*8}%,${.25+.6*(c+1)/2})`;
 x.globalCompositeOperation='lighter';
 for(const p of disk){const[c,s]=pos(p);if(s>=0)continue;const rr=p.r*Rh;x.fillStyle=col(p,c);x.fillRect(cx+c*rr,cy+s*rr*.26,p.s,p.s);x.fillRect(cx+c*rr*.6,cy+s*rr*.62,p.s,p.s);if(p.r>2.4)x.fillRect(cx+c*rr*.5,cy-s*rr*.5,p.s,p.s)}
 x.globalCompositeOperation='source-over';
 x.fillStyle='#000';x.shadowColor='#ffb060';x.shadowBlur=30;x.beginPath();x.arc(cx,cy,Rh,0,TAU);x.fill();x.shadowBlur=0;x.strokeStyle='rgba(255,220,160,.85)';x.lineWidth=2.5;x.beginPath();x.arc(cx,cy,Rh*1.03,0,TAU);x.stroke();
 x.globalCompositeOperation='lighter';for(const p of disk){const[c,s]=pos(p);if(s<0)continue;x.fillStyle=col(p,c);x.fillRect(cx+c*p.r*Rh,cy+s*p.r*Rh*.26,p.s,p.s)}
 x.globalCompositeOperation='source-over';x.fillStyle='rgba(255,255,255,.6)';x.font='13px system-ui';x.fillText('Event horizon: yahan se light bhi wapas nahi aati',cx-Rh*2.2,cy+Rh*3.3)}

/* 6 BIRDS */
function birds(t){
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2b1055');g.addColorStop(.55,'#d4507a');g.addColorStop(1,'#ffb066');x.fillStyle=g;x.fillRect(0,0,W,H);
 const sx=W*.3,sy=H*.64;g=x.createRadialGradient(sx,sy,10,sx,sy,H*.5);g.addColorStop(0,'#fff1c1');g.addColorStop(.12,'rgba(255,220,150,.8)');g.addColorStop(1,'rgba(255,150,100,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle='rgba(255,200,180,.22)';for(let i=0;i<6;i++){x.beginPath();x.ellipse(((i*.23+t*.000008*(1+i%3))%1.4-.2)*W,H*(.15+i*.07),150,10+i*2,0,0,TAU);x.fill()}
 ridge('#3a1a4a',.8,.14,.005,3);ridge('#1b0d2e',.9,.08,.007,1);
 const lt=t/6000,lx=W*(.5+.3*Math.cos(lt))+(mx-.5)*100,ly=H*(.33+.1*Math.sin(lt*1.3))+(my-.4)*80,d=Math.sin(lt)<0?1:-1;
 for(let i=0;i<25;i++){const row=Math.ceil(i/2),side=i%2?1:-1;bird(lx-d*row*30,ly+side*row*15+Math.sin(t/500+i)*4,10,t+i*80,d)}
 for(let i=0;i<12;i++)bird(((t*.03*(1+i%3*.3)+i*200)%(W+100))-50,H*(.1+(i%5)*.07)+Math.sin(t/600+i)*5,6,t+i*50,1);
 bird(W*.5+Math.cos(t/3500)*W*.25,H*.2+Math.sin(t/3500)*20,26,t*.35,Math.sin(t/3500)>0?-1:1)}

/* 7 ANIME DANGER MODE */
const fl=Array.from({length:110},()=>({x:R(-1,1),y:R(0,1),v:R(.3,1),s:R(4,14)}));let bolts=[],lastB=0;
function anime(t){
 const cx=W/2,cy=H*.6,u=Math.min(W/520,H/680),pl=.5+.5*Math.sin(t/180),M=Math.max(W,H);
